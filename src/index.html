<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>4 мазхаба</title>
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/500-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/amiri/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/amiri/700.css">
<style>
  :root {
    --bg: #030814; --navy: #0a1730; --blue: #3b8cff; --sky: #8fd0ff;
    --beige: #e8d5b0; --sand: #c9a46c; --cream: #f6eedf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 40%, #0b1a38 0%, #050c1c 55%, #02050d 100%); }
  #pattern, #map, #ov, #fx, #parts { position: absolute; inset: 0; }
  #map { will-change: transform; }
  #countries path { fill: #0e1f40; stroke: rgba(140,185,255,.38); stroke-width: 1; vector-effect: non-scaling-stroke; }
  #hl path { vector-effect: non-scaling-stroke; stroke-width: 2; }
  #labels text { font-family: 'Playfair Display'; font-weight: 600; letter-spacing: .14em; fill: rgba(232,213,176,.5); text-anchor: middle; }
  .lt { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }

  .row { position: absolute; left: 0; right: 0; text-align: center; padding: 0 60px; }
  .layer { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .ovs { position: absolute; inset: 0; overflow: visible; }
  .w { display: inline-block; white-space: pre; }
  .ttl { font-family: 'Playfair Display', 'Amiri', serif; font-weight: 900; line-height: 1.08; color: var(--cream);
    text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  .it { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; color: var(--beige);
    text-shadow: 0 2px 20px rgba(0,0,0,.8); }
  .sans { font-family: 'Montserrat', 'Amiri', sans-serif; font-weight: 600; color: var(--beige); text-shadow: 0 2px 16px rgba(0,0,0,.8); }
  .acc { color: #6fb2ff !important; text-shadow: 0 0 28px rgba(59,140,255,.9), 0 0 60px rgba(59,140,255,.5) !important; }
  .grad { font-family: 'Playfair Display', 'Amiri', serif; font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #fffaf0 10%, #ead7b2 55%, #b99258 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; padding: 0 .06em; }
  .gradb { font-family: 'Playfair Display', serif; font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #e6f3ff 5%, #7fbcff 45%, #2a6fe8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; padding: 0 .06em; }
  .slam { display: inline-block; transform-origin: 50% 60%; }
  .ar { font-family: 'Amiri', serif; font-weight: 700; color: var(--cream); line-height: 1.2; direction: rtl; }

  .tag { display: inline-block; font: 700 25px 'Montserrat', sans-serif; letter-spacing: .22em; color: #d6e8ff;
    border: 1.5px solid rgba(111,178,255,.75); background: rgba(16,44,100,.45); padding: 13px 28px; border-radius: 999px;
    box-shadow: 0 0 34px rgba(59,140,255,.4), inset 0 0 18px rgba(59,140,255,.25); }
  .pill { display: inline-block; font: 600 38px 'Montserrat', sans-serif; color: var(--cream);
    border: 1.5px solid rgba(232,213,176,.6); background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    padding: 16px 38px; border-radius: 999px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 30px rgba(232,213,176,.18); }
  .card { position: absolute; text-align: center; padding: 26px 38px 28px; border-radius: 30px;
    background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
    border: 1.5px solid rgba(232,213,176,.5); backdrop-filter: blur(16px);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25), 0 0 46px rgba(59,140,255,.18); }
  .card h3 { font-family: 'Playfair Display', 'Amiri', serif; font-weight: 800; color: var(--cream); line-height: 1.1; }
  .card p { font: 500 29px/1.35 'Montserrat', 'Amiri', sans-serif; color: rgba(232,213,176,.88); margin-top: 10px; }
  .cap { position: absolute; left: 50%; transform-origin: 0 50%; max-width: 960px; width: max-content;
    background: linear-gradient(90deg, #f6ecd8, #e6cfa3); color: #0a1630; font: 700 33px/1.3 'Montserrat', 'Amiri', sans-serif;
    padding: 16px 30px; border-radius: 8px; box-shadow: 0 0 40px rgba(232,213,176,.35), 0 10px 30px rgba(0,0,0,.5); text-align: center; }
  .cap i { display: inline-block; width: 3px; height: 34px; background: #0a1630; vertical-align: -6px; margin-left: 3px; }
  .lbl { position: absolute; font-family: 'Playfair Display', serif; font-weight: 800; white-space: nowrap;
    color: #f1e2c4; text-shadow: 0 0 22px rgba(232,200,140,.55), 0 3px 12px rgba(0,0,0,.9); }
  .node { position: absolute; left: 50%; width: 640px; margin-left: -320px; text-align: center; border-radius: 999px;
    border: 1.5px solid rgba(232,213,176,.55); background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
    backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,.5); padding: 18px 20px; }
  .node b { font: 800 40px 'Playfair Display', serif; color: var(--beige); }
  .node small { display: block; font: 500 24px 'Montserrat', 'Amiri', sans-serif; color: rgba(232,213,176,.75); margin-top: 4px; }
  .node.main { border-color: rgba(111,178,255,.9); background: linear-gradient(180deg, rgba(59,140,255,.35), rgba(20,50,120,.25));
    box-shadow: 0 0 50px rgba(59,140,255,.55), 0 10px 40px rgba(0,0,0,.5); }
  .node.main b { font-size: 50px; font-weight: 900; color: #fff; letter-spacing: .06em; }
  .book { position: absolute; left: 50%; width: 500px; height: 580px; margin-left: -250px; border-radius: 20px;
    background: linear-gradient(155deg, #1d3566 0%, #0c1a3a 55%, #071128 100%); border: 2px solid #c9a46c;
    box-shadow: 0 0 90px rgba(59,140,255,.4), 0 40px 90px rgba(0,0,0,.7), inset 0 0 0 12px rgba(201,164,108,.10); overflow: hidden; }
  .book .in { position: absolute; inset: 26px; border: 1.5px solid rgba(232,213,176,.55); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .book .sweep { position: absolute; top: -20%; bottom: -20%; width: 160px;
    background: linear-gradient(90deg, transparent, rgba(255,245,225,.28), transparent); transform: skewX(-18deg); }
  .medn { font: 700 31px 'Montserrat', sans-serif; letter-spacing: .08em; color: var(--beige); text-shadow: 0 2px 14px rgba(0,0,0,.9); }
  .pt { position: absolute; border-radius: 50%; }
  #fx { pointer-events: none;
    background: radial-gradient(130% 75% at 50% 48%, transparent 45%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.85) 100%); }
  #flash { position: absolute; inset: 0; mix-blend-mode: screen;
    background: radial-gradient(70% 45% at 50% 46%, rgba(160,205,255,.75), rgba(59,140,255,.25) 45%, transparent 75%); }
  #black { position: absolute; inset: 0; background: #000; }
  .shade { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 45%, rgba(2,6,16,.75), rgba(2,6,16,.25) 70%, transparent); }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="medFill" r="0.7"><stop offset="0" stop-color="#16346e"/><stop offset="1" stop-color="#071230"/></radialGradient>
      <radialGradient id="medInner" r="0.8"><stop offset="0" stop-color="#11285a"/><stop offset="1" stop-color="#050c1f"/></radialGradient>
      <radialGradient id="dotGlow"><stop offset="0" stop-color="#fff6e4" stop-opacity="1"/><stop offset=".35" stop-color="#e8d5b0" stop-opacity=".7"/><stop offset="1" stop-color="#3b8cff" stop-opacity="0"/></radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <pattern id="stars" width="160" height="160" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="rgba(143,208,255,.10)" stroke-width="1.2">
          <rect x="40" y="40" width="80" height="80"/><rect x="40" y="40" width="80" height="80" transform="rotate(45 80 80)"/>
          <circle cx="80" cy="80" r="22"/><path d="M0 0L40 40M160 0L120 40M0 160L40 120M160 160L120 120"/>
        </g>
      </pattern>
    </defs>
  </svg>
  <svg id="pattern" width="1080" height="1920"><rect id="patRect" x="-1200" y="-1200" width="3480" height="4320" fill="url(#stars)"/></svg>
  <svg id="map" width="1080" height="1920"><g id="cam"></g></svg>
  <div id="parts"></div>
  <div id="ov"></div>
  <div id="fx"></div>
  <div id="flash"></div>
  <div id="black"></div>
</div>
<script src="map-data.js"></script>
<script src="voice.js"></script>
<script src="main.js"></script>
</body>
</html>
